name: Daily NBA Model Refresh

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

jobs:
  refresh-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip pandas scikit-learn joblib

      - name: Refresh NBA model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run refresh:nba-model

      - name: Commit updated model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/nba-logistic-model.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit."
            exit 0
          fi
          git commit -m "Refresh NBA model artifact"
          git push
